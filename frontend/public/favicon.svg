<svg viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="134%" y2="134%">
      <stop offset="0%" style="stop-color:rgba(41,132,138,1)" />
      <stop offset="68%" style="stop-color:rgba(53,108,139,1)" />
      <stop offset="100%" style="stop-color:rgba(20,61,88,1)" />
    </linearGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.9)" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)" />
    </radialGradient>
  </defs>
  
  <!-- Main circular background -->
  <circle cx="35" cy="35" r="35" fill="url(#logoGradient)"/>
  
  <!-- Shine effect -->
  <circle cx="20" cy="20" r="19.5" fill="url(#shine)" opacity="0.8"/>
  
  <!-- DPX Text -->
  <text x="35" y="45" font-family="Inter, Helvetica, sans-serif" font-size="25" font-weight="800" fill="white" text-anchor="middle" dominant-baseline="middle" stroke="#35758d" stroke-width="1">DPX</text>
</svg>